# fast2_lora with 4.5 min per task instead of 5: lora sessions hit the cap more (38/66 vs 26/66 in r005) and run
# ~9% slower, and fast2 already took 10 h 53 m of the 12 h wall. lb probe for the lora path, not a gate winner
# fast2 keeps fast_cap's 24 tool-call cap: the harness warns every call once 10 or fewer remain, which in r001
# is about where agents should have been wrapping up instead of timing out (2/3 of sessions did)
evaluation:
  timeout_seconds: 120
  max_tool_calls: 24
  max_time_minutes: 4.5
  max_turns: 100
