# fast2 keeps fast_cap's 24 tool-call cap: the harness warns every call once 10 or fewer remain, which in r001
# is about where agents should have been wrapping up instead of timing out (2/3 of sessions did)
# 240 s because the hidden test run inherits this number (verification.py runs pytest with
# command_timeout_seconds, which config.py fills from timeout_seconds). 11 of 1,185 local grades took
# over 100 s, and the agent side doesn't care: 1 timeout in ~4,900 run_command calls. r012 gated the
# prompt at 120 so the kernel's setup steps wouldn't eat the quota; sky picked 240 for the ship config
evaluation:
  timeout_seconds: 240
  max_tool_calls: 24
  max_time_minutes: 5
  max_turns: 100
